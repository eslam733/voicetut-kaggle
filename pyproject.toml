[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetut-kaggle"
version = "0.1.0"
description = "Clone voices and record many Egyptian Arabic lines with VoiceTut-TTS on Kaggle's free GPUs, checked by speech recognition."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6,<7",       # voices.yaml
    "requests>=2.28,<3",  # downloads from Kaggle's API
    "kaggle>=2.0,<3",     # the official Kaggle CLI (push, status, datasets); tested with 2.2.5
]

[project.scripts]
vk = "voicetut_kaggle.cli:main"

[tool.setuptools]
packages = ["voicetut_kaggle"]
